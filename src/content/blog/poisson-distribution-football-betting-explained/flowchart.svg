<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280">
  <rect width="720" height="280" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="2" />
  <!-- Node 1 -->
  <rect x="40" y="90" width="160" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  <text x="120" y="125" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">1. League Data</text>
  <text x="120" y="148" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Home &amp; Away Avgs</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="130" x2="250" y2="130" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)" />
  <polygon points="250,130 240,125 240,135" fill="#3b82f6" />

  <!-- Node 2 -->
  <rect x="260" y="90" width="180" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
  <text x="350" y="125" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">2. Team Strengths</text>
  <text x="350" y="148" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Attack &amp; Defense Ratios</text>

  <!-- Arrow 2 -->
  <line x1="440" y1="130" x2="490" y2="130" stroke="#10b981" stroke-width="2" />
  <polygon points="490,130 480,125 480,135" fill="#10b981" />

  <!-- Node 3 -->
  <rect x="500" y="90" width="180" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
  <text x="590" y="125" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">3. Poisson Matrix</text>
  <text x="590" y="148" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Scorelines &amp; True Odds</text>

  <!-- Title -->
  <text x="360" y="45" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">QUANTITATIVE MODELING PIPELINE</text>
</svg>
