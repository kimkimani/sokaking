  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  
  <!-- Subtle decorative grid background -->
  <g opacity="0.15">
    <line x1="100" y1="50" x2="100" y2="400" stroke="#334155" stroke-width="1" />
    <line x1="250" y1="50" x2="250" y2="400" stroke="#334155" stroke-width="1" />
    <line x1="400" y1="50" x2="400" y2="400" stroke="#334155" stroke-width="1" />
    <line x1="550" y1="50" x2="550" y2="400" stroke="#334155" stroke-width="1" />
    <line x1="700" y1="50" x2="700" y2="400" stroke="#334155" stroke-width="1" />
    <line x1="50" y1="120" x2="750" y2="120" stroke="#334155" stroke-width="1" />
    <line x1="50" y1="220" x2="750" y2="220" stroke="#334155" stroke-width="1" />
    <line x1="50" y1="320" x2="750" y2="320" stroke="#334155" stroke-width="1" />
  </g>

  <!-- Decorative Jackpot Badges -->
  <rect x="250" y="150" width="300" height="150" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2" opacity="0.9" />
  <circle cx="400" cy="195" r="28" fill="url(#goldGrad)" opacity="0.9" />
  <path d="M400 178 L404 190 L416 190 L406 198 L410 210 L400 202 L390 210 L394 198 L384 190 L396 190 Z" fill="#0f172a" />

  <text x="400" y="250" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle" letter-spacing="1">SPORTPESA MEGA JACKPOT</text>
  <text x="400" y="275" fill="#10b981" font-family="monospace" font-weight="bold" font-size="13" text-anchor="middle">SOKA KING PREDICTION ENGINE</text>

  <!-- Title & Subtitle -->
  <text x="400" y="70" fill="#f8fafc" font-family="sans-serif" font-weight="800" font-size="24" text-anchor="middle">BEST MEGA JACKPOT PREDICTION SITE</text>
  <text x="400" y="100" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">Empirical Mathematical Modeling &amp; 17-Game Algorithmic Slips</text>

  <!-- Bottom Metric Pills -->
  <g transform="translate(140, 345)">
    <rect width="150" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="75" y="25" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">17/17 MODELING</text>
  </g>
  <g transform="translate(325, 345)">
