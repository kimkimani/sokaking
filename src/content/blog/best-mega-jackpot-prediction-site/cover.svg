    <text x="75" y="25" fill="#10b981" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">POISSON EDGE</text>
  </g>
  <g transform="translate(510, 345)">
    <rect width="150" height="40" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
    <text x="75" y="25" fill="#fbbf24" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">BONUS TARGETING</text>
